<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TRIOSWORLD — Three vibes, one world. Premium Indian men's streetwear, graphic tees and everyday essentials. Shop men's t-shirts online in India." />
    <meta name="keywords" content="men's t-shirts, streetwear india, oversized tees, graphic tees, men's fashion, triosworld" />
    <meta name="theme-color" content="#171717" />
    <title>TRIOSWORLD — Three Vibes. One World. | Men's Streetwear & Tees</title>

    <!-- Open Graph -->
    <meta property="og:title" content="TRIOSWORLD — Three Vibes. One World." />
    <meta property="og:description" content="Premium Indian men's streetwear, graphic tees and everyday essentials. Shop men's t-shirts online in India." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.triosworld.in/" />
    <meta property="og:image" content="https://www.triosworld.in/og-image.jpg" />
    <meta property="og:site_name" content="TRIOSWORLD" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRIOSWORLD — Three Vibes. One World." />
    <meta name="twitter:description" content="Premium Indian men's streetwear, graphic tees and everyday essentials." />
    <meta name="twitter:image" content="https://www.triosworld.in/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- The two image hosts the storefront renders from. Warmed during the
         HTML request so the LCP hero and the first product shots do not pay a
         fresh DNS + TLS round trip on every cold visit. -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://clvwowrplnkwkiotriiu.supabase.co" crossorigin />
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />
    <link rel="preconnect" href="https://api.razorpay.com" crossorigin />
    <link rel="dns-prefetch" href="https://lumberjack.razorpay.com" />

    <!-- LCP preload. The hero is client-rendered, so without this its photo
         waits more than a second for React to hydrate before the download
         even starts (measured: 1.1s "resource load delay" in Lighthouse).
         This preloads the first campaign slide at exactly the widths
         HeroSlider can request (same URL builder, same srcset), so the
         browser picks the same variant and there is no double fetch. If a
         new campaign photo is set in Admin → Content, the preload simply
         fetches an unused file once and stops mattering. -->
    <link rel="preload" as="image" fetchpriority="high"
      imagesizes="100vw"
      imagesrcset="https://images.pexels.com/photos/9775889/pexels-photo-9775889.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=640&h=360 640w, https://images.pexels.com/photos/9775889/pexels-photo-9775889.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=900&h=506 900w, https://images.pexels.com/photos/9775889/pexels-photo-9775889.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1280&h=720 1280w" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
