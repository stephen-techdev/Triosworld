<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TRIOSWORLD — Three vibes, one world. Premium Indian men's streetwear, graphic tees and everyday essentials. Shop men's t-shirts online in India." />
    <meta name="keywords" content="men's t-shirts, streetwear india, oversized tees, graphic tees, men's fashion, triosworld" />
    <meta name="theme-color" content="#171717" />
    <title>TRIOSWORLD — Three Vibes. One World. | Men's Streetwear & Tees</title>

    <!-- Open Graph -->
    <meta property="og:title" content="TRIOSWORLD — Three Vibes. One World." />
    <meta property="og:description" content="Premium Indian men's streetwear, graphic tees and everyday essentials. Shop men's t-shirts online in India." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.triosworld.in/" />
    <meta property="og:image" content="https://www.triosworld.in/og-image.jpg" />
    <meta property="og:site_name" content="TRIOSWORLD" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRIOSWORLD — Three Vibes. One World." />
    <meta name="twitter:description" content="Premium Indian men's streetwear, graphic tees and everyday essentials." />
    <meta name="twitter:image" content="https://www.triosworld.in/og-image.jpg" />

    <!-- Fonts are self-hosted (public/fonts, single latin variable file per
         family). Preloading the two critical files here replaces the old
         fonts.googleapis.com stylesheet entirely, which Lighthouse measured
         at ~1.2s of render-blocking time. crossorigin is required because
         font preloads always use CORS mode. -->
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The two image hosts the storefront renders from. Warmed during the
         HTML request so the LCP hero and the first product shots do not pay a
         fresh DNS + TLS round trip on every cold visit. -->
    <!-- Preconnects only. There is deliberately no `preload as=image` for the
         homepage hero: "/" renders the shop grid, not the hero, so a preloaded
         campaign photo only stole bandwidth from the product image that is the
         real LCP here (measured in Lighthouse). -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://clvwowrplnkwkiotriiu.supabase.co" crossorigin />
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />
    <link rel="preconnect" href="https://api.razorpay.com" crossorigin />
    <link rel="dns-prefetch" href="https://lumberjack.razorpay.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
